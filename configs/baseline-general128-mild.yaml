# General-edit comparison run using UltraEdit's published quality scores.
experiment:
  name: ip2p_sd_general128_mild
  output_dir: checkpoints/ip2p_sd_general128_mild

model:
  type: baseline
  pretrained: stable-diffusion-v1-5/stable-diffusion-v1-5
  device: cuda

dataset:
  type: ultraedit
  name: BleachNick/UltraEdit_500k
  split: FreeForm
  resolution: 128
  streaming: true
  shuffle_buffer_size: 1000
  max_train_samples: 100000
  min_scores:
    clip_sim_image: 0.82
    clip_sim_dir: 0.365
    dinov2_sim: 0.6

evaluation:
  enabled: true
  source: magicbrush_dev
  name: osunlp/MagicBrush
  num_examples: 20
  num_images: 10
  num_inference_steps: 30
  every_steps: 2500
  at_epoch_end: false

training:
  batch_size: 8
  gradient_accumulation_steps: 1
  epochs: 2
  save_every_epochs: 1
  learning_rate: 5.0e-5
  weight_decay: 0.01
  seed: 42
  mixed_precision: fp16
  conditioning_dropout_prob: 0.05
  max_grad_norm: 1.0

inference:
  num_inference_steps: 30
  source_guidance_scale: 1.5
  instruction_guidance_scale: 7.5
