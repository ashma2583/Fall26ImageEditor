experiment:
  name: ip2p_sd_pilot
  output_dir: checkpoints/ip2p_sd_pilot

model:
  type: baseline
  pretrained: stable-diffusion-v1-5/stable-diffusion-v1-5
  device: cuda

dataset:
  type: instructpix2pix
  name: timbrooks/instructpix2pix-clip-filtered
  resolution: 256
  streaming: true
  max_train_samples: 1000
  shuffle_buffer_size: 1000

evaluation:
  name: osunlp/MagicBrush
  enabled: true
  num_examples: 8
  num_images: 2
  num_inference_steps: 10
  every_steps: 2000

training:
  batch_size: 4
  epochs: 1
  learning_rate: 5.0e-5
  weight_decay: 0.01
  seed: 42

  mixed_precision: fp16
  gradient_accumulation_steps: 2
  conditioning_dropout_prob: 0.05
  max_grad_norm: 1.0

inference:
  num_inference_steps: 30
  source_guidance_scale: 1.5
  instruction_guidance_scale: 7.5
