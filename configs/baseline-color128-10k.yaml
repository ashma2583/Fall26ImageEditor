# Focused color-edit run from Stable Diffusion 1.5.
# Train on 10,000 matching UltraEdit examples; reserve the next 10 for evaluation.
experiment:
  name: ip2p_sd_color128_10k
  output_dir: checkpoints/ip2p_sd_color128_10k

model:
  type: baseline
  pretrained: stable-diffusion-v1-5/stable-diffusion-v1-5
  device: cuda

dataset:
  type: ultraedit
  name: BleachNick/UltraEdit_500k
  split: FreeForm
  edit_category: Change Color
  resolution: 128
  streaming: true
  shuffle_buffer_size: 1000
  max_train_samples: 10000
  materialize: true

evaluation:
  enabled: true
  source: train_and_heldout
  num_train_examples: 10
  num_holdout_examples: 10
  num_images: 10
  num_inference_steps: 30
  every_steps: 500
  at_epoch_end: false

training:
  batch_size: 8
  gradient_accumulation_steps: 1
  epochs: 6
  save_every_epochs: 1
  learning_rate: 5.0e-5
  weight_decay: 0.01
  seed: 42
  mixed_precision: fp16
  conditioning_dropout_prob: 0.05
  max_grad_norm: 1.0

inference:
  num_inference_steps: 30
  source_guidance_scale: 1.5
  instruction_guidance_scale: 7.5
