# Focused sign-of-life run: keyword-inferred color edits from UltraEdit_500k.
# The first 2,000 matching examples train the model; the next 16 are held out.
experiment:
  name: ip2p_sd_color128
  output_dir: checkpoints/ip2p_sd_color128

model:
  type: baseline
  pretrained: stable-diffusion-v1-5/stable-diffusion-v1-5
  device: cuda

dataset:
  type: ultraedit
  name: BleachNick/UltraEdit_500k
  split: FreeForm
  edit_category: Change Color
  resolution: 128
  streaming: true
  shuffle_buffer_size: 1000
  max_train_samples: 2000
  materialize: true

evaluation:
  enabled: true
  source: heldout
  num_examples: 16
  num_images: 3
  num_inference_steps: 30
  every_steps: 250
  at_epoch_end: false

training:
  batch_size: 8
  gradient_accumulation_steps: 1
  epochs: 8
  max_train_steps: 2000
  save_every_epochs: 2
  learning_rate: 5.0e-5
  weight_decay: 0.01
  seed: 42
  mixed_precision: fp16
  conditioning_dropout_prob: 0.05
  max_grad_norm: 1.0

inference:
  num_inference_steps: 30
  source_guidance_scale: 1.5
  instruction_guidance_scale: 7.5
